schema_version: 1

catalog:
  catalog_id: telephony
  name: Telephony Reference Catalog
  revision: "2026-08-07"
  catalog_kind: protocol_reference
  local_root: ${CONTROL_PLANE_ROOT}/reference/telephony
  source_policy:
    local_source_notes: true
    external_fetch: false
    full_documents_vendored: false

reference_types:
  reference_architecture:
    purpose: "Logical components, responsibilities and boundaries."
  call_flow:
    purpose: "States, transitions, branches, timers and observable outcomes."
  deployment_architecture:
    purpose: "Placement, redundancy, plane separation and operational boundaries."
  protocol_profile:
    purpose: "A constrained protocol behaviour and negotiation contract."
  interconnection_specification:
    purpose: "Inter-domain or provider-facing interoperability requirements."

