entries:
  - reference_id: telephony.sip.registration
    catalog_id: telephony
    category: sip
    reference_type: protocol_profile
    title: SIP registration and reachability
    source_refs:
      - source_id: sipconnect-2.0
        local_path: sources/sipconnect-2.0.md
        anchor: "Registration and static modes"
      - source_id: rfc-3261
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3261 — SIP"
    applies_when:
      - "A provider locates a SIP endpoint through registration or configured reachability."
      - "The incident concerns REGISTER, Contact, authentication, expiry or reachability."
    preconditions:
      - "The selected registration/static profile is known."
      - "The signaling transport and domain boundary are identified."
    invariants:
      - "The selected discovery mode is explicit and observable."
      - "Registration state, expiry and reachable Contact agree with the active profile."
    allowed_variants:
      - "Registration mode and static mode are different valid SIPconnect profiles."
      - "A border element may terminate or relay registration according to the deployment."
    failure_modes:
      - "Registration succeeds but the routed Contact is unreachable."
      - "Expiry, credentials or transport policy silently disagree between peers."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing sip state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - sip_trace
      - registration_state
      - dns_or_static_route
      - sbc_configuration
    verification_targets:
      - protocol_requirement
      - invariant
      - failure_mode

  - reference_id: telephony.sip.transaction-lifecycle
    catalog_id: telephony
    category: sip
    reference_type: call_flow
    title: SIP transaction lifecycle
    source_refs:
      - source_id: rfc-3261
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3261 — SIP"
    applies_when:
      - "A request, retransmission, provisional response or timeout is under investigation."
    preconditions:
      - "The method, transaction branch and transport are available."
    flow_states:
      - "request_sent"
      - "provisional_response"
      - "final_response"
      - "completed_or_terminated"
    invariants:
      - "Transaction state is not inferred from a single response line."
      - "Retransmissions and timeout handling are interpreted with the method and transport."
    failure_modes:
      - "A client treats a transaction timeout as a successful dialog state."
      - "A late response is attributed to the wrong branch or call."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing sip state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - sip_branch
      - cseq
      - response_code
      - retransmission_and_timer_log
    verification_targets:
      - flow_transition
      - invariant
      - failure_mode

  - reference_id: telephony.sip.dialog-lifecycle
    catalog_id: telephony
    category: sip
    reference_type: call_flow
    title: SIP dialog lifecycle
    source_refs:
      - source_id: rfc-3261
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3261 — SIP"
    applies_when:
      - "The issue concerns call establishment, in-dialog requests, re-INVITE, UPDATE or teardown."
    preconditions:
      - "Call identifiers, tags and dialog direction are available."
    flow_states:
      - "early_dialog"
      - "confirmed_dialog"
      - "session_modified"
      - "terminated_dialog"
    invariants:
      - "A transaction exchange and a dialog lifecycle are tracked separately."
      - "In-dialog requests use the dialog route and identity state established for that dialog."
    failure_modes:
      - "A re-INVITE or BYE is routed as a new independent call."
      - "Forked early dialogs are collapsed without evidence."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing sip state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - call_id
      - local_and_remote_tags
      - route_set
      - cseq_progression
    verification_targets:
      - flow_transition
      - contract
      - failure_mode

  - reference_id: telephony.sip.proxy-routing
    catalog_id: telephony
    category: sip
    reference_type: protocol_profile
    title: SIP proxy routing and server location
    source_refs:
      - source_id: rfc-3261
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3261 — SIP"
      - source_id: rfc-3263
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3263 — SIP server location"
    applies_when:
      - "The call reaches the wrong peer, fails DNS discovery or crosses a proxy/SBC boundary."
    preconditions:
      - "The Request-URI, Route set, transport and target domain are known."
    invariants:
      - "The selected target and transport can be reconstructed from the SIP URI and routing data."
      - "Fallback routing is explicit rather than hidden in an unrelated application retry."
    failure_modes:
      - "DNS, URI transport and SBC route disagree."
      - "Topology hiding removes the evidence needed to correlate the next hop."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing sip state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - request_uri
      - route_and_record_route
      - dns_records
      - proxy_or_sbc_route_log
    verification_targets:
      - protocol_requirement
      - deployment_boundary
      - failure_mode

  - reference_id: telephony.sip.authentication
    catalog_id: telephony
    category: sip
    reference_type: protocol_profile
    title: SIP identity and authentication boundary
    source_refs:
      - source_id: sipconnect-2.0
        local_path: sources/sipconnect-2.0.md
        anchor: "Security and interconnection"
      - source_id: rfc-3261
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3261 — SIP"
    applies_when:
      - "Registration, origination or interconnection fails around identity or credentials."
    preconditions:
      - "The peer boundary and authentication mechanism are identified."
    invariants:
      - "Authentication outcome and asserted identity are correlated with the same SIP transaction."
      - "Credential failures are not retried as if they were media failures."
    failure_modes:
      - "A successful TLS connection is treated as successful SIP authorization."
      - "The asserted identity and authenticated endpoint are not bound by policy."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing sip state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - sip_response_code
      - auth_challenge
      - tls_peer_identity
      - provider_or_sbc_auth_log
    verification_targets:
      - protocol_requirement
      - invariant
      - failure_mode

  - reference_id: telephony.sip.failure-response
    catalog_id: telephony
    category: sip
    reference_type: call_flow
    title: SIP failure response and recovery
    source_refs:
      - source_id: rfc-3261
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3261 — SIP"
      - source_id: sipconnect-2.0
        local_path: sources/sipconnect-2.0.md
        anchor: "Call origination and termination"
    applies_when:
      - "A call fails, is rejected, times out or falls back to another route."
    preconditions:
      - "The failing transaction, response class and route attempt are known."
    invariants:
      - "A failure is classified by the response, transaction state and route context."
      - "Fallback or retry does not create an uncorrelated duplicate call."
    failure_modes:
      - "Every failure is retried identically, amplifying provider or network load."
      - "A final SIP failure is hidden behind a generic application error."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing sip state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - final_response
      - timer_or_transport_error
      - route_attempt_id
      - retry_log
    verification_targets:
      - flow_transition
      - failure_mode
      - contract

  - reference_id: telephony.sip.peering
    catalog_id: telephony
    category: sip
    reference_type: interconnection_specification
    title: SIP service-provider peering
    source_refs:
      - source_id: rfc-5486
        local_path: sources/speermint.md
        anchor: "Session peering model"
      - source_id: rfc-6406
        local_path: sources/speermint.md
        anchor: "Functional components"
    applies_when:
      - "A session crosses two SIP service-provider or carrier domains."
    preconditions:
      - "Originating, terminating and any indirect provider domains are identified."
    invariants:
      - "The inter-domain signaling boundary and routing function are explicit."
      - "Signaling-path and data-path border responsibilities are separately observable."
    allowed_variants:
      - "Direct and indirect peering are valid but have different routing evidence."
      - "Logical functions may be combined in one deployment component."
    failure_modes:
      - "A direct route is assumed while traffic traverses an indirect provider."
      - "Media border policy is inferred from signaling border policy."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing sip state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - provider_domain
      - luf_lrf_or_route_lookup
      - sbe_dbe_or_sbc_policy
      - interconnect_trace
    verification_targets:
      - interconnection_contract
      - deployment_boundary
      - failure_mode

  - reference_id: telephony.sdp.offer-answer
    catalog_id: telephony
    category: sdp
    reference_type: protocol_profile
    title: SDP offer and answer
    source_refs:
      - source_id: rfc-3264
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3264 and RFC 4566 — SDP offer/answer"
      - source_id: rfc-4566
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3264 and RFC 4566 — SDP offer/answer"
    applies_when:
      - "A call answers but media, codec or session parameters are wrong."
    preconditions:
      - "The relevant SDP offer and answer are captured without redaction of protocol fields."
    invariants:
      - "The answer is compatible with the offered media sections and payload formats."
      - "Address, port, direction and format parameters are checked per media section."
    allowed_variants:
      - "Offer/answer may occur in INVITE/200, re-INVITE/200 or UPDATE flows."
      - "A gateway may adapt a profile when the adaptation is explicit."
    failure_modes:
      - "SIP reaches 200 OK while the answer has no mutually usable media."
      - "A hold or resume direction change is ignored by one endpoint."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing sdp state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - sdp_offer
      - sdp_answer
      - media_section_match
      - codec_selection
    verification_targets:
      - protocol_requirement
      - invariant
      - failure_mode

  - reference_id: telephony.sdp.media-direction
    catalog_id: telephony
    category: sdp
    reference_type: call_flow
    title: SDP media direction and session modification
    source_refs:
      - source_id: rfc-3264
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3264 and RFC 4566 — SDP offer/answer"
    applies_when:
      - "Hold, resume, mute, one-way audio or re-INVITE behaviour is under review."
    preconditions:
      - "The before/after SDP media sections and session modification request are known."
    invariants:
      - "Direction changes are represented in SDP and correlated with the in-dialog request."
      - "Resume restores a mutually compatible direction and media path."
    failure_modes:
      - "UI mute is treated as network hold without a corresponding protocol state."
      - "One endpoint resumes locally while the peer remains inactive."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing sdp state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - reinvite_or_update
      - media_direction
      - signaling_state
      - media_packet_flow
    verification_targets:
      - flow_transition
      - invariant
      - failure_mode

  - reference_id: telephony.rtp.rtp-rtcp
    catalog_id: telephony
    category: rtp
    reference_type: protocol_profile
    title: RTP and RTCP media transport
    source_refs:
      - source_id: rfc-3550
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3550 and RFC 3551 — RTP/RTCP"
      - source_id: rfc-3551
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 3550 and RFC 3551 — RTP/RTCP"
    applies_when:
      - "Signaling succeeds but audio is absent, one-way, distorted or degraded."
    preconditions:
      - "The negotiated payload type, ports and endpoint addresses are available."
    invariants:
      - "RTP payload/profile agrees with the SDP contract."
      - "Sequence, timestamp and SSRC continuity are interpreted with the selected stream."
      - "RTCP observations are kept separate from SIP dialog state."
    failure_modes:
      - "Packets arrive on a port or payload type not selected by SDP."
      - "RTP is present in one direction while the reverse path is blocked or misrouted."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing rtp state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - rtp_packets
      - rtcp_reports
      - sequence_and_ssrc
      - jitter_loss_and_rtt
    verification_targets:
      - protocol_requirement
      - invariant
      - failure_mode

  - reference_id: telephony.nat.ice
    catalog_id: telephony
    category: nat-traversal
    reference_type: protocol_profile
    title: ICE candidate gathering and nomination
    source_refs:
      - source_id: rfc-8445
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 8445, RFC 5389 and RFC 5766 — ICE, STUN and TURN"
    applies_when:
      - "WebRTC or ICE-enabled media fails across NAT, firewall or multihoming."
    preconditions:
      - "Local and remote candidates, ICE credentials and checklist state are available."
    invariants:
      - "Candidates are exchanged through the selected signaling/session description."
      - "Connectivity checks and nomination produce an identifiable selected pair."
    allowed_variants:
      - "Direct, server-reflexive and relayed candidates are valid according to topology."
      - "ICE-Lite and full ICE have different responsibilities."
    failure_modes:
      - "Candidate gathering succeeds but no pair is nominated."
      - "A selected pair exists but the media endpoint uses a different address or port."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing nat-traversal state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - ice_candidates
      - checklist_state
      - nominated_pair
      - consent_or_keepalive_state
    verification_targets:
      - flow_transition
      - protocol_requirement
      - failure_mode

  - reference_id: telephony.nat.stun-turn
    catalog_id: telephony
    category: nat-traversal
    reference_type: deployment_architecture
    title: STUN/TURN relay placement
    source_refs:
      - source_id: rfc-5389
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 8445, RFC 5389 and RFC 5766 — ICE, STUN and TURN"
      - source_id: rfc-5766
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 8445, RFC 5389 and RFC 5766 — ICE, STUN and TURN"
    applies_when:
      - "Connectivity depends on public address discovery or relayed media."
    preconditions:
      - "Network topology, relay allocation policy and credential lifetime are known."
    invariants:
      - "TURN allocation and relay reachability match the candidate advertised to the peer."
      - "Relay use is observable and does not silently change the expected media path."
    failure_modes:
      - "TURN credentials expire before ICE checks complete."
      - "Firewall policy permits signaling but blocks the relay allocation or media ports."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing nat-traversal state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - stun_turn_logs
      - relay_allocation
      - firewall_and_security_group
      - selected_media_path
    verification_targets:
      - deployment_boundary
      - invariant
      - failure_mode

  - reference_id: telephony.security.tls-dtls-srtp
    catalog_id: telephony
    category: security
    reference_type: protocol_profile
    title: SIP TLS and DTLS-SRTP security chain
    source_refs:
      - source_id: sipconnect-2.0
        local_path: sources/sipconnect-2.0.md
        anchor: "Security and interconnection"
      - source_id: rfc-5763
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 5763, RFC 5764 and RFC 8827 — secure media"
      - source_id: rfc-5764
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 5763, RFC 5764 and RFC 8827 — secure media"
      - source_id: rfc-8827
        local_path: sources/ietf-sip-media.md
        anchor: "RFC 5763, RFC 5764 and RFC 8827 — secure media"
    applies_when:
      - "Signaling or WebRTC media security negotiation is failing or being audited."
    preconditions:
      - "The transport, peer identity and selected media security profile are known."
    invariants:
      - "TLS, DTLS, certificate/fingerprint and SRTP states are checked separately."
      - "The remote SDP fingerprint is bound to the authenticated DTLS peer."
    failure_modes:
      - "A valid SIP/TLS connection is treated as proof that media is encrypted."
      - "DTLS completes against a fingerprint that is not the one signaled for the session."
    diagnostic_branch:
      - "Start with the entry preconditions and collect the listed observable evidence."
      - "Compare the first failing security state or boundary with the exact source anchor."
      - "Follow the listed failure modes and mark UNKNOWN when the evidence cannot distinguish them."
    observable_evidence:
      - tls_handshake
      - certificate_or_fingerprint
      - dtls_state
      - srtp_context
    verification_targets:
      - protocol_requirement
      - invariant
      - failure_mode

  - reference_id: telephony.topology.sbc-media-relay
    catalog_id: telephony
    category: topology
    reference_type: reference_architecture
    title: SBC and media-relay boundary
    source_refs:
      - source_id: sipconnect-2.0
        local_path: sources/sipconnect-2.0.md
        anchor: "Reference architecture"
      - source_id: rfc-6406
        local_path: sources/speermint.md
        anchor: "Functional components"
    applies_when:
      - "A border component terminates, relays or anchors SIP and/or media."
    preconditions:
      - "Signaling and media responsibilities of the border component are declared."
    invariants:
      - "SIP topology policy and media anchoring policy are independently observable."
      - "The relay preserves or intentionally transforms the negotiated media contract."
    allowed_variants:
      - "Signaling and media may terminate on one component or separate components."
      - "Logical SBE/DBE/SBC responsibilities may be combined."
